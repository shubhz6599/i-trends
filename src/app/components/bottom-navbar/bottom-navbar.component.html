<nav class="bottom-nav" aria-label="Quick navigation">
  <a class="bottom-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <i class="bi bi-house" aria-hidden="true"></i>
    <span class="nav-text">Home</span>
  </a>

  <div class="contact-nav-item">
    <button
      type="button"
      class="bottom-nav-link"
      (click)="toggleOptions()"
      [attr.aria-expanded]="showContactOptions"
      aria-controls="contact-options">
      <i class="bi bi-chat-dots" aria-hidden="true"></i>
      <span class="nav-text">Contact</span>
    </button>
    <div *ngIf="showContactOptions" id="contact-options" class="contact-popover">
      <div class="contact-popover-heading">
        <strong>Need a hand?</strong>
        <span>Choose how to reach us</span>
      </div>
      <div class="contact-options">
        <button type="button" class="option-btn" (click)="call()">
          <i class="bi bi-telephone-fill" aria-hidden="true"></i>
          <span>Call</span>
        </button>
        <button type="button" class="option-btn" (click)="mail()">
          <i class="bi bi-envelope-fill" aria-hidden="true"></i>
          <span>Mail</span>
        </button>
        <button type="button" class="option-btn" (click)="whatsapp()">
          <i class="bi bi-whatsapp" aria-hidden="true"></i>
          <span>WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <a class="bottom-nav-link" routerLink="/cart" routerLinkActive="active">
    <i class="bi bi-bag" aria-hidden="true"></i>
    <span class="nav-text">Cart</span>
  </a>

  <button
    *ngIf="isAuthenticated; else accountLink"
    type="button"
    class="bottom-nav-link account-link"
    disabled
    aria-disabled="true"
    aria-label="Account is available from the account page when signed in"
    title="You are already signed in">
    <i class="bi bi-person-check" aria-hidden="true"></i>
    <span class="nav-text">Account</span>
  </button>
  <ng-template #accountLink>
    <a class="bottom-nav-link" routerLink="/auth" routerLinkActive="active">
      <i class="bi bi-person" aria-hidden="true"></i>
      <span class="nav-text">Account</span>
    </a>
  </ng-template>

  <button
    type="button"
    class="bottom-nav-link theme-nav-link"
    (click)="toggleTheme()"
    [attr.aria-label]="theme.usesSystemPreference() ? (theme.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme') : 'Use device theme'"
    [title]="theme.usesSystemPreference() ? (theme.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme') : 'Use device theme'">
    <i class="bi" [ngClass]="theme.isDarkMode() ? 'bi-sun-fill' : 'bi-moon-stars-fill'" aria-hidden="true"></i>
    <span class="nav-text">{{ theme.usesSystemPreference() ? 'Theme' : 'System' }}</span>
  </button>
</nav>
