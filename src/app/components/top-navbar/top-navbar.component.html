<nav class="navbar" [class.menu-open]="isMenuOpen" aria-label="Main navigation">
  <div class="mobile-header">
    <button
      type="button"
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-navigation"
      [attr.aria-label]="isMenuOpen ? 'Close navigation menu' : 'Open navigation menu'">
      <i class="bi" [ngClass]="{ 'bi-list': !isMenuOpen, 'bi-x': isMenuOpen }"></i>
    </button>

    <a class="logo" routerLink="/" aria-label="i-Trends home">
      <span class="logo-wordmark"><span>i</span>-trends</span>
    </a>

    <button
      *ngIf="isMenuOpen"
      type="button"
      class="mobile-menu-backdrop"
      aria-label="Close navigation menu"
      (click)="closeMenu()">
    </button>

    <div class="nav-content" id="primary-navigation" [class.active]="isMenuOpen">
      <form class="search-container" (ngSubmit)="onSearch(); closeMenu()">
        <label class="visually-hidden" for="store-search">Search eyewear</label>
        <input
          id="store-search"
          type="search"
          name="searchQuery"
          class="search-bar"
          placeholder="Search frames, styles and more"
          [(ngModel)]="searchQuery">
        <button type="submit" class="search-button" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
      </form>

      <ul class="menu-items">
        <li (click)="closeMenu()"><a routerLink="/account"><i class="bi bi-person"></i> Account</a></li>
        <li (click)="closeMenu()"><a routerLink="/user-orders"><i class="bi bi-bag-check"></i> My Orders</a></li>
        <li (click)="closeMenu()"><a routerLink="/know-more-about-us"><i class="bi bi-info-circle"></i> About</a></li>
        <li *ngIf="isAdmin" (click)="closeMenu()"><a routerLink="/admin"><i class="bi bi-person-gear"></i> Admin</a></li>
        <li (click)="closeMenu()"><a routerLink="/auth"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
      </ul>
    </div>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="theme.usesSystemPreference() ? (theme.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme') : 'Use device theme'"
      [title]="theme.usesSystemPreference() ? (theme.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme') : 'Use device theme'">
      <i class="bi" [ngClass]="theme.isDarkMode() ? 'bi-sun-fill' : 'bi-moon-stars-fill'" aria-hidden="true"></i>
    </button>

    <a class="cart-icon" routerLink="/cart" aria-label="Shopping cart">
      <i class="bi bi-bag"></i>
      <span class="cart-count">{{ cartCount }}</span>
    </a>
  </div>
</nav>
